<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secretyon</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 6%;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .login {
      background: white;
      color: black;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 90px 20px;
      text-align: center;
    }

    h1 {
      font-size: 52px;
      margin-bottom: 20px;
    }

    p {
      color: #aaa;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .button {
      display: inline-block;
      background: white;
      color: black;
      padding: 15px 28px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Secretyon</div>
    <a class="login" href="#">Entrar</a>
  </header>

  <main>
    <h1>Seu conteúdo.<br>Do seu jeito.</h1>

    <p>
      Uma nova plataforma para criadores compartilharem
      conteúdo exclusivo com seus assinantes.
    </p>

    <a class="button" href="#">Começar agora</a>
  </main>

</body>
</html>
