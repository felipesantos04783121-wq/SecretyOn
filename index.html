<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secretyon</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 6%;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    button {
      background: white;
      color: black;
      border: 0;
      padding: 11px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 90px 20px;
      text-align: center;
    }

    h1 {
      font-size: 52px;
      margin-bottom: 20px;
    }

    p {
      color: #aaa;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.8);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: #17171d;
      padding: 30px;
      border-radius: 15px;
    }

    .box h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #0b0b0f;
      color: white;
    }

    .close {
      background: #333;
      color: white;
      margin-left: 8px;
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Secretyon</div>
    <button onclick="abrirLogin()">Entrar</button>
  </header>

  <main>
    <h1>Seu conteúdo.<br>Do seu jeito.</h1>

    <p>
      Uma nova plataforma para criadores compartilharem
      conteúdo exclusivo com seus assinantes.
    </p>

    <button onclick="abrirLogin()">Começar agora</button>
  </main>

  <div class="modal" id="modal">
    <div class="box">
      <h2>Entrar no Secretyon</h2>

      <input type="email" id="email" placeholder="Seu e-mail">
      <input type="password" id="senha" placeholder="Sua senha">

      <button onclick="entrar()">Entrar</button>
      <button onclick="abrirCadastro()">Criar conta</button>
      <button class="close" onclick="fecharLogin()">Fechar</button>

      <div class="message" id="mensagem"></div>
    </div>
  </div>
  <div class="modal" id="cadastroModal">
  <div class="box">
    <h2>Criar conta no Secretyon</h2>

    <input type="text" id="cadastroNome" placeholder="Seu nome">

    <input type="email" id="cadastroEmail" placeholder="Seu e-mail">

    <input type="password" id="cadastroSenha" placeholder="Sua senha">

    <input type="password" id="cadastroSenhaConfirmacao" placeholder="Confirme sua senha">

    <button onclick="cadastrar()">Criar conta</button>

    <button class="close" onclick="fecharCadastro()">Fechar</button>

    <div class="message" id="mensagemCadastro"></div>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://xcxvwlbiubauwjxhjkyj.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_KFDSA_GITFGL0GXnQVBaPw_fk3fSQhs";

  const { createClient } = supabase;

  const supabaseClient = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  
  function abrirCadastro() {
  document.getElementById("cadastroModal").style.display = "flex";
}

function fecharCadastro() {
  document.getElementById("cadastroModal").style.display = "none";
}function abrirLogin() {
    document.getElementById("modal").style.display = "flex";
  }

  function fecharLogin() {
    document.getElementById("modal").style.display = "none";
  }

  async function entrar() {
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;
    const mensagem = document.getElementById("mensagem");

    if (!email || !senha) {
      mensagem.innerText = "Preencha seu e-mail e sua senha.";
      return;
    }

    mensagem.innerText = "Entrando...";

    const { error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: senha
    });

    if (error) {
      mensagem.innerText = "E-mail ou senha incorretos.";
      console.error(error);
      return;
    }

    mensagem.innerText = "Login realizado com sucesso!";

    setTimeout(() => {
      fecharLogin();
    }, 1000);
  }
async function cadastrar() {
  const nome = document.getElementById("cadastroNome").value.trim();
  const email = document.getElementById("cadastroEmail").value.trim();
  const senha = document.getElementById("cadastroSenha").value;
  const confirmacao = document.getElementById("cadastroSenhaConfirmacao").value;
  const mensagem = document.getElementById("mensagemCadastro");

  if (!nome || !email || !senha || !confirmacao) {
    mensagem.innerText = "Preencha todos os campos.";
    return;
  }

  if (senha !== confirmacao) {
    mensagem.innerText = "As senhas não conferem.";
    return;
  }

  if (senha.length < 6) {
    mensagem.innerText = "A senha precisa ter pelo menos 6 caracteres.";
    return;
  }

  mensagem.innerText = "Criando sua conta...";

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: senha,
    options: {
      data: {
        nome: nome
      }
    }
  });

  if (error) {
    mensagem.innerText = error.message;
    return;
  }

  mensagem.innerText =
    "Conta criada com sucesso! Verifique seu e-mail para confirmar a conta.";

  document.getElementById("cadastroNome").value = "";
  document.getElementById("cadastroEmail").value = "";
  document.getElementById("cadastroSenha").value = "";
  document.getElementById("cadastroSenhaConfirmacao").value = "";
}</script>

</body>
</html>
