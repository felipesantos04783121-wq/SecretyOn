<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secretyon</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 6%;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    button {
      background: white;
      color: black;
      border: 0;
      padding: 11px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 90px 20px;
      text-align: center;
    }

    h1 {
      font-size: 52px;
      margin-bottom: 20px;
    }

    p {
      color: #aaa;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.8);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: #17171d;
      padding: 30px;
      border-radius: 15px;
    }

    .box h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #0b0b0f;
      color: white;
    }

    .close {
      background: #333;
      color: white;
      margin-left: 8px;
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Secretyon</div>
    <button onclick="abrirLogin()">Entrar</button>
  </header>

  <main>
    <h1>Seu conteúdo.<br>Do seu jeito.</h1>

    <p>
      Uma nova plataforma para criadores compartilharem
      conteúdo exclusivo com seus assinantes.
    </p>

    <button onclick="abrirLogin()">Começar agora</button>
  </main>

  <div class="modal" id="modal">
    <div class="box">
      <h2>Entrar no Secretyon</h2>

      <input type="email" id="email" placeholder="Seu e-mail">
      <input type="password" id="senha" placeholder="Sua senha">

      <button onclick="entrar()">Entrar</button>
      <button class="close" onclick="fecharLogin()">Fechar</button>

      <div class="message" id="mensagem"></div>
    </div>
  </div>

  <script>
    function abrirLogin() {
      document.getElementById("modal").style.display = "flex";
    }

    function fecharLogin() {
      document.getElementById("modal").style.display = "none";
    }

    function entrar() {
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      if (!email || !senha) {
        document.getElementById("mensagem").innerText =
          "Preencha seu e-mail e sua senha.";
        return;
      }

      document.getElementById("mensagem").innerText =
        "Login será conectado ao Supabase na próxima etapa.";
    }
  </script>

</body>
</html>
